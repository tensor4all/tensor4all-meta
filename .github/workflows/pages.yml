name: Deploy stack guides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "branding/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The logo gallery (site/logos/) shows the files under branding/.
      - name: Copy logo files into the site
        run: |
          mkdir -p site/branding
          for d in branding/*/; do
            name=$(basename "$d")
            mkdir -p "site/branding/$name"
            cp -R "$d"svg "$d"png "site/branding/$name/" 2>/dev/null || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
