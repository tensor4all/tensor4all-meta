<text x="217.5" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#8A2E1C" text-anchor="middle">Not allowed: two engines on one pool</text>
