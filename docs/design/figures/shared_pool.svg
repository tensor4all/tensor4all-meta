<text x="217" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8A2E1C" text-anchor="middle">per-pool state in each engine cannot see the other</text>
