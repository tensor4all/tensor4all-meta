<text x="332" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">P8 / P4</text>
<text x="380" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">find the pivot (|a| max, first index)</text>
<rect x="300" y="142" width="64" height="22" rx="4" fill="#FDF3E1" fill-opacity="0.7" stroke="#B7832F" stroke-width="1.2"/>
<text x="332" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">P7</text>
<text x="380" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">swap rows k and the pivot</text>
<rect x="300" y="174" width="64" height="22" rx="4" fill="#FDF3E1" fill-opacity="0.7" stroke="#B7832F" stroke-width="1.2"/>
<text x="332" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">P9</text>
<text x="380" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">safe reciprocal of the pivot; scale the column</text>
<rect x="300" y="206" width="64" height="22" rx="4" fill="#FDF3E1" fill-opacity="0.7" stroke="#B7832F" stroke-width="1.2"/>
<text x="332" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">P4</text>
<text x="380" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">rank-1 update of the rest of the panel</text>
<text x="300" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4A4844" text-anchor="start">small enough to stay in registers or L1: a natural override point</text>
