<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#77756F" stroke-width="1.5"/></marker></defs>
<rect width="860" height="270" fill="#FCFCFA"/>
<text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start">P2  Level-3 triangular solve (trsm)</text>
<text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4A4844" text-anchor="start">many right-hand sides; the solution overwrites B</text>
<rect x="60" y="80" width="110" height="110" rx="3" fill="#FFFFFF" stroke="#B8B5AE" stroke-width="1.2"/>
<polygon points="60,80 60,190 170,190" fill="#EEEDFD" stroke="#6A62D6" stroke-width="1.2"/>
<text x="90" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2C2C2A" text-anchor="middle">L</text>
<text x="115" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">triangular, read</text>
<text x="195" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4A4844" text-anchor="middle">X</text>
<rect x="220" y="80" width="150" height="110" rx="3" fill="#E3F4EC" stroke="#2F7A57" stroke-width="1.2"/>
<text x="295" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2C2C2A" text-anchor="middle">B  →  X</text>
<text x="295" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">overwritten</text>
<text x="600" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#2C2C2A" text-anchor="middle">solve  L·X = B</text>
<text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">blocked: one diagonal block by a small</text>
<text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="middle">solve, the rest of B by P1 (gemm)</text>
<rect x="24" y="239" width="14" height="14" rx="2" fill="#EEEDFD" stroke="#6A62D6" stroke-width="1.2"/>
<text x="44" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A4844" text-anchor="start">read only</text>
<rect x="117.4" y="239" width="14" height="14" rx="2" fill="#E3F4EC" stroke="#2F7A57" stroke-width="1.2"/>
<text x="137.4" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A4844" text-anchor="start">written</text>
</svg>
