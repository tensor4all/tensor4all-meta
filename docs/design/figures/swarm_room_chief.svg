<text x="54" y="97" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#18202b" xml:space="preserve">tenferro-rs: CPU einsum got about 15% slower since last week. Find out why and fix it. Check</text>
<text x="54" y="116" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#18202b" xml:space="preserve">on a quiet machine before merging.</text>
<circle cx="30" cy="159" r="13" fill="#4a4fd1"/>
<text x="30" y="163.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">C</text>
<text x="54" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a4fd1">chief</text>
