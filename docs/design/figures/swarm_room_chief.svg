<text x="54" y="620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#18202b" xml:space="preserve">Stopped 1 queued bench job (tensor4all-rs). minipc-1 has no leases until you say so.</text>
